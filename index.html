<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가공 타이머</title>
<link rel="icon" href="icon.ico" type="image/x-icon">

<style>
:root{
  --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;
  --border:#d1d5db;--input:#fff;--accent:#2563eb;--accent2:#1d4ed8;
  --danger:#dc2626;--soft:#f9fafb;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Arial,"Noto Sans KR",sans-serif;
}
body.dark{
  --bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;
  --border:#4b5563;--input:#111827;--accent:#60a5fa;--accent2:#3b82f6;
  --soft:#18212f;
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(760px,calc(100% - 24px));margin:18px auto}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.08);padding:16px;
}
body.dark .card{box-shadow:0 8px 28px rgba(0,0,0,.25)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.theme-btn{
  border:1px solid var(--border);background:var(--soft);color:var(--text);
  border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700
}
.section{
  border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:9px;
  background:var(--soft)
}
.section-title{font-size:12px;font-weight:800;margin-bottom:7px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{min-width:0}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select{
  width:100%;height:34px;border:1px solid var(--border);border-radius:7px;
  background:var(--input);color:var(--text);padding:5px 8px;outline:none
}
input:focus,select:focus{border-color:var(--accent)}
.readonly{opacity:.85}
.search-wrap{position:relative}
.dropdown{
  position:absolute;left:0;right:0;top:100%;z-index:20;max-height:220px;
  overflow:auto;background:var(--card);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.15);margin-top:3px
}
.option{padding:8px;font-size:12px;cursor:pointer}
.option:hover{background:rgba(37,99,235,.12)}
.small{font-size:11px;color:var(--muted)}
.timer-box{
  margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:10px;
  text-align:center;background:var(--soft)
}
.timer{
  font-family:Consolas,monospace;font-size:38px;font-weight:800;letter-spacing:1px;
  margin:3px 0 9px
}
.timer.done{color:#16a34a}
.timer-buttons{display:flex;justify-content:center;gap:7px}
.btn{
  border:0;border-radius:7px;padding:8px 16px;color:#fff;font-size:12px;font-weight:800
}
.start{background:#16a34a}.start:hover{background:#15803d}
.stop{background:#dc2626}.stop:hover{background:#b91c1c}
.reset{background:#6b7280}.reset:hover{background:#4b5563}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alarm-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}
.preview{height:34px;padding:0 12px;border:0;border-radius:7px;background:#4b5563;color:#fff;font-size:11px;font-weight:800}
details{margin-top:9px}
summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--muted)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-top:9px}
.result-item{font-size:11px;border-bottom:1px dashed var(--border);padding:4px 0}
.result-item b{float:right}
.note{margin-top:8px;font-size:10px;color:var(--muted);line-height:1.5}
.table-wrap{overflow:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border-bottom:1px solid var(--border);padding:6px;text-align:left;white-space:nowrap}
th{color:var(--muted)}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:#111827;color:#fff;padding:9px 14px;border-radius:8px;
  font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:100
}
.toast.show{opacity:1}
@media(max-width:620px){
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 .empty{display:none}
  .grid2{grid-template-columns:1fr}
  .result-grid{grid-template-columns:1fr}
  .timer{font-size:32px}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <header>
      <h1>가공 타이머</h1>
      <button class="theme-btn" id="themeToggle">🌙 다크 모드</button>
    </header>

    <div class="section">
      <div class="section-title">가공 설정</div>
      <div class="grid3">
        <div class="field">
          <label>1회당 가공횟수</label>
          <input id="batchCount" type="number" min="1" value="260">
        </div>
        <div class="field">
          <label>가공 성공률 (%)</label>
          <input id="successRate" type="number" min="0" max="100" step="0.1" value="100">
        </div>
        <div class="field empty"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">무게</div>
      <div class="grid3">
        <div class="field">
          <label>현재 무게 (LT)</label>
          <input id="currentWeight" type="number" min="0" step="0.01" value="748.4">
        </div>
        <div class="field">
          <label>최대 무게 (LT)</label>
          <input id="maxWeight" type="number" min="0" step="0.01" value="1502">
        </div>
        <div class="field">
          <label>무게 제한</label>
          <select id="weightLimit">
            <option value="1">100%</option>
            <option value="1.05">105%</option>
            <option value="1.10">110%</option>
            <option value="1.15">115%</option>
            <option value="1.20">120%</option>
            <option value="1.25" selected>125%</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">재료</div>
      <div class="grid2">
        <div class="field search-wrap">
          <label>원재료</label>
          <input id="rawInput" autocomplete="off" placeholder="원재료 또는 가공품 검색">
          <div id="materialDropdown" class="dropdown" hidden></div>
        </div>
        <div class="field">
          <label>가공품</label>
          <input id="productInput" class="readonly" readonly>
        </div>
      </div>
      <div class="field" style="margin-top:8px">
        <label>보유 갯수</label>
        <input id="owned" type="number" min="0" step="1" value="29636">
      </div>
    </div>

    <div class="section">
      <div class="section-title">알림음</div>
      <div class="alarm-row">
        <div class="field">
          <label>종료 알림음</label>
          <select id="alarmSelect"></select>
        </div>
        <button class="preview" id="previewAlarm">🔈 들어보기</button>
      </div>
      <div class="small" style="margin-top:5px">알림음은 <b>sounds/</b> 폴더의 MP3 파일을 사용합니다.</div>
    </div>

    <div class="timer-box">
      <div class="small" id="timerStatus">계산 후 타이머를 시작할 수 있습니다.</div>
      <div class="timer" id="timerDisplay">00:00:00</div>
      <div class="timer-buttons">
        <button class="btn start" id="startBtn">시작</button>
        <button class="btn stop" id="stopBtn" disabled>정지</button>
        <button class="btn reset" id="resetBtn">초기화</button>
      </div>
    </div>

    <details>
      <summary>계산 결과 보기</summary>
      <div id="result" class="result-grid"></div>
      <div class="note">
        • 가공 성공 여부는 1회당 가공횟수 전체에 대해 한 번 판정합니다.<br>
        • 성공한 가공 1회마다 가공품 평균 2개를 생산합니다.<br>
        • 성공한 가공품의 무게를 먼저 더한 뒤 제한 초과 여부를 검사하므로 마지막 가공은 제한을 초과할 수 있습니다.<br>
        • 성공률이 100% 미만이면 표시 시간은 평균/예상 시간입니다.
      </div>
    </details>

    <details>
      <summary>재료 데이터 보기</summary>
      <div class="table-wrap">
        <table>
          <thead><tr><th>원재료</th><th>가공품</th><th>가공품 무게</th><th>1회 소비</th><th>가공 시간</th></tr></thead>
          <tbody id="dataTable"></tbody>
        </table>
      </div>
    </details>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 데이터
// ============================================================
const materialData = [
  {raw:"철광석", product:"녹아내린 철 조각", weight:0.3, consume:5, time:60},
  {raw:"구리 광석", product:"녹아내린 구리 조각", weight:0.25, consume:5, time:60},
  {raw:"주석 광석", product:"녹아내린 주석 조각", weight:0.2, consume:5, time:60}
];

const AVG_OUTPUT = 2;

const alarmData = [
  {id:"alarm1", name:"알림음 1", file:"sounds/alarm1.mp3"},
  {id:"alarm2", name:"알림음 2", file:"sounds/alarm2.mp3"},
  {id:"alarm3", name:"알림음 3", file:"sounds/alarm3.mp3"},
  {id:"alarm4", name:"알림음 4", file:"sounds/alarm4.mp3"},
  {id:"alarm5", name:"알림음 5", file:"sounds/alarm5.mp3"}
];

// ============================================================
// 상태
// ============================================================
const $ = id => document.getElementById(id);

let selectedMaterial = materialData[0];

let requiredSuccessCycles = 0;
let expectedAttempts = 0;
let expectedOutput = 0;
let expectedFinalWeight = 0;
let totalDuration = 0;

// 항로 타이머와 같은 방식:
// "몇 초 지났는가"를 누적하지 않고 "언제 끝나는가"를 저장한다.
let timerRunning = false;
let timerInterval = null;
let timerEndTimestamp = null;
let timerRemainingSeconds = 0;

const ACTIVE_TIMER_KEY = "processingActiveTimer";
const ALARM_KEY = "processingAlarm";
const THEME_KEY = "processingTheme";

let toastTimer = null;

// ============================================================
// 초기화
// ============================================================
function init() {
  loadTheme();
  initAlarmSelect();
  renderMaterialTable();
  selectMaterial(materialData[0]);
  loadSavedAlarm();
  restoreActiveTimer();

  $("rawInput").addEventListener("input", renderMaterialDropdown);
  $("rawInput").addEventListener("focus", renderMaterialDropdown);
  $("rawInput").addEventListener("blur", () => {
    setTimeout(() => $("materialDropdown").hidden = true, 150);
  });

  [
    "batchCount","successRate","currentWeight","maxWeight","weightLimit","owned"
  ].forEach(id => {
    $(id).addEventListener("input", calculate);
    $(id).addEventListener("change", calculate);
  });

  $("alarmSelect").addEventListener("change", () => {
    localStorage.setItem(ALARM_KEY, $("alarmSelect").value);
  });

  $("previewAlarm").addEventListener("click", previewAlarm);

  $("startBtn").addEventListener("click", startTimer);
  $("stopBtn").addEventListener("click", stopTimer);
  $("resetBtn").addEventListener("click", resetTimer);
  $("themeToggle").addEventListener("click", toggleTheme);

  // 항로 타이머와 동일한 핵심 처리:
  // 백그라운드에서 setInterval이 지연되어도 복귀하는 순간 실제 시간을 다시 계산한다.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && timerRunning) {
      tickTimer();
    }
  });

  window.addEventListener("focus", () => {
    if (timerRunning) tickTimer();
  });

  calculate();
}

document.addEventListener("DOMContentLoaded", init);

// ============================================================
// 재료 검색
// ============================================================
function renderMaterialDropdown() {
  const q = $("rawInput").value.trim().toLowerCase();
  const dropdown = $("materialDropdown");

  const matches = materialData.filter(m =>
    !q ||
    m.raw.toLowerCase().includes(q) ||
    m.product.toLowerCase().includes(q)
  );

  dropdown.innerHTML = "";

  matches.forEach(material => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = `${material.raw} → ${material.product}`;
    div.addEventListener("mousedown", e => {
      e.preventDefault();
      selectMaterial(material);
    });
    dropdown.appendChild(div);
  });

  dropdown.hidden = matches.length === 0;
}

function selectMaterial(material) {
  selectedMaterial = material;
  $("rawInput").value = material.raw;
  $("productInput").value = material.product;
  $("materialDropdown").hidden = true;
  calculate();
}

// ============================================================
// 계산
// ============================================================
function calculate() {
  // 실행 중에는 계산값을 바꾸지 않는다.
  // 실행 중 설정 변경으로 종료 시각이 갑자기 바뀌는 것을 방지한다.
  if (timerRunning) return;

  const batchCount = Math.max(1, Number($("batchCount").value) || 1);
  const successRate = Math.min(100, Math.max(0, Number($("successRate").value) || 0));
  const currentWeight = Math.max(0, Number($("currentWeight").value) || 0);
  const maxWeight = Math.max(0, Number($("maxWeight").value) || 0);
  const weightMultiplier = Number($("weightLimit").value) || 1;
  const owned = Math.max(0, Number($("owned").value) || 0);

  const limit = maxWeight * weightMultiplier;

  const outputPerSuccess = batchCount * AVG_OUTPUT;
  const weightIncreasePerSuccess = outputPerSuccess * selectedMaterial.weight;
  const materialConsumePerSuccess = batchCount * selectedMaterial.consume;

  const remainingWeight = Math.max(0, limit - currentWeight);

  let weightCycles;
  if (weightIncreasePerSuccess <= 0) {
    weightCycles = Infinity;
  } else if (remainingWeight <= 0) {
    weightCycles = 0;
  } else {
    weightCycles = Math.ceil(remainingWeight / weightIncreasePerSuccess);
  }

  const materialCycles =
    materialConsumePerSuccess > 0
      ? Math.floor(owned / materialConsumePerSuccess)
      : Infinity;

  requiredSuccessCycles = Math.min(weightCycles, materialCycles);

  // 성공률은 전체 batch 한 번에 한 번 판정하므로
  // 필요한 성공 횟수 / 성공률 = 예상 batch 시도 횟수
  expectedAttempts =
    successRate > 0
      ? requiredSuccessCycles / (successRate / 100)
      : Infinity;

  expectedOutput = requiredSuccessCycles * outputPerSuccess;
  expectedFinalWeight =
    currentWeight + requiredSuccessCycles * weightIncreasePerSuccess;

  totalDuration =
    Number.isFinite(expectedAttempts)
      ? expectedAttempts * selectedMaterial.time
      : 0;

  timerRemainingSeconds = Math.max(0, Math.ceil(totalDuration));

  renderResult({
    batchCount,
    successRate,
    currentWeight,
    maxWeight,
    limit,
    owned,
    outputPerSuccess,
    weightIncreasePerSuccess,
    materialConsumePerSuccess,
    weightCycles,
    materialCycles,
    requiredSuccessCycles,
    expectedAttempts,
    expectedOutput,
    expectedFinalWeight,
    totalDuration
  });

  renderTimer();
}

// ============================================================
// 결과 표시
// ============================================================
function fmt(n, digits=2) {
  if (!Number.isFinite(n)) return "∞";
  return Number(n).toLocaleString("ko-KR", {
    maximumFractionDigits: digits
  });
}

function renderResult(v) {
  let limitingReason = "없음";

  if (v.requiredSuccessCycles === 0) {
    if (v.currentWeight >= v.limit) limitingReason = "무게 제한";
    else if (v.materialCycles === 0) limitingReason = "원재료 부족";
  } else if (v.weightCycles < v.materialCycles) {
    limitingReason = "무게 제한";
  } else if (v.materialCycles < v.weightCycles) {
    limitingReason = "원재료 부족";
  } else {
    limitingReason = "무게 / 원재료 동시";
  }

  $("result").innerHTML = `
    <div class="result-item">무게 제한 <b>${fmt(v.limit)} LT</b></div>
    <div class="result-item">가공품 <b>${selectedMaterial.product}</b></div>
    <div class="result-item">1회 성공 생산량 <b>${fmt(v.outputPerSuccess,0)}개</b></div>
    <div class="result-item">1회 성공 무게 증가 <b>${fmt(v.weightIncreasePerSuccess)} LT</b></div>
    <div class="result-item">1회 성공 원재료 소비 <b>${fmt(v.materialConsumePerSuccess,0)}개</b></div>
    <div class="result-item">무게 기준 성공 횟수 <b>${fmt(v.weightCycles,0)}회</b></div>
    <div class="result-item">재료 기준 성공 횟수 <b>${fmt(v.materialCycles,0)}회</b></div>
    <div class="result-item">중단 기준 <b>${limitingReason}</b></div>
    <div class="result-item">필요 성공 횟수 <b>${fmt(v.requiredSuccessCycles,0)}회</b></div>
    <div class="result-item">예상 전체 시도 횟수 <b>${fmt(v.expectedAttempts,2)}회</b></div>
    <div class="result-item">예상 생산량 <b>${fmt(v.expectedOutput,0)}개</b></div>
    <div class="result-item">예상 최종 무게 <b>${fmt(v.expectedFinalWeight)} LT</b></div>
    <div class="result-item">예상 소요 시간 <b>${formatDuration(v.totalDuration)}</b></div>
  `;
}

function renderMaterialTable() {
  $("dataTable").innerHTML = materialData.map(m => `
    <tr>
      <td>${m.raw}</td>
      <td>${m.product}</td>
      <td>${m.weight} LT</td>
      <td>${m.consume}개</td>
      <td>${m.time}초</td>
    </tr>
  `).join("");
}

// ============================================================
// 타이머
// ============================================================

// 핵심:
// timerEndTimestamp가 "타이머의 진짜 상태"다.
// interval은 단지 화면을 자주 갱신하기 위한 장치다.
function startTimer() {
  if (timerRunning) return;

  if (!Number.isFinite(totalDuration) || totalDuration <= 0) {
    showToast("실행할 가공 시간이 없습니다.");
    return;
  }

  // 계산 결과를 다시 읽어 현재 남은 시간으로 시작
  timerRemainingSeconds = Math.max(0, Math.ceil(totalDuration));

  if (timerRemainingSeconds <= 0) {
    finishTimer();
    return;
  }

  timerRunning = true;
  timerEndTimestamp = Date.now() + timerRemainingSeconds * 1000;

  saveActiveTimer();

  // 사용자 클릭 직후 사운드 파일을 미리 로드한다.
  // 실제 종료 시에는 이미 로드된 Audio 객체를 사용한다.
  preloadAlarm();

  tickTimer();

  if (timerRunning) {
    timerInterval = setInterval(tickTimer, 250);
  }

  updateTimerButtons();
  $("timerStatus").textContent = "가공 진행 중";
}

function tickTimer() {
  if (!timerRunning || timerEndTimestamp === null) return;

  const remainingMs = timerEndTimestamp - Date.now();

  timerRemainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));

  renderTimer();

  if (remainingMs <= 0) {
    finishTimer();
  }
}

function stopTimer() {
  if (!timerRunning) return;

  // 먼저 실제 현재 시각을 기준으로 남은 시간을 확정한다.
  const remainingMs = timerEndTimestamp - Date.now();
  timerRemainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));

  timerRunning = false;
  timerEndTimestamp = null;

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  clearActiveTimer();
  updateTimerButtons();
  renderTimer();
  $("timerStatus").textContent = "정지됨";
}

function resetTimer() {
  timerRunning = false;
  timerEndTimestamp = null;

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  clearActiveTimer();

  calculate();

  $("timerStatus").textContent = "계산 후 타이머를 시작할 수 있습니다.";
}

function finishTimer() {
  if (!timerRunning) return;

  timerRunning = false;
  timerRemainingSeconds = 0;
  timerEndTimestamp = null;

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  clearActiveTimer();

  renderTimer();
  updateTimerButtons();

  $("timerStatus").textContent = "가공 완료";
  $("timerDisplay").classList.add("done");

  playAlarm();

  showToast("가공이 완료되었습니다!");

  // 완료 후 자동으로 계산값을 다시 준비한다.
  // 사용자가 바로 다시 시작할 수 있도록 한다.
  setTimeout(() => {
    $("timerDisplay").classList.remove("done");
    if (!timerRunning) {
      calculate();
      $("timerStatus").textContent = "다시 시작할 수 있습니다.";
    }
  }, 1200);
}

function renderTimer() {
  $("timerDisplay").textContent = formatDuration(timerRemainingSeconds);
}

function updateTimerButtons() {
  $("startBtn").disabled = timerRunning || timerRemainingSeconds <= 0;
  $("stopBtn").disabled = !timerRunning;
}

// ============================================================
// 백그라운드 탭 대응
// ============================================================

// 항로 타이머의 ACTIVE_TIMER_KEY 방식과 동일하게,
// "몇 초가 흘렀는지"가 아니라 "언제 끝나는지"를 저장한다.
function saveActiveTimer() {
  if (!timerRunning || !timerEndTimestamp) return;

  try {
    localStorage.setItem(ACTIVE_TIMER_KEY, JSON.stringify({
      endTimestamp: timerEndTimestamp,
      totalDuration,
      remainingSeconds: timerRemainingSeconds
    }));
  } catch (e) {
    console.warn("활성 타이머 저장 실패:", e);
  }
}

function clearActiveTimer() {
  try {
    localStorage.removeItem(ACTIVE_TIMER_KEY);
  } catch (e) {
    console.warn("활성 타이머 삭제 실패:", e);
  }
}

function restoreActiveTimer() {
  let saved = null;

  try {
    saved = JSON.parse(localStorage.getItem(ACTIVE_TIMER_KEY) || "null");
  } catch (e) {
    saved = null;
  }

  if (!saved || !saved.endTimestamp) return;

  const remainingMs = saved.endTimestamp - Date.now();

  if (remainingMs <= 0) {
    clearActiveTimer();
    timerRemainingSeconds = 0;
    renderTimer();
    $("timerStatus").textContent = "이전 타이머가 백그라운드에서 종료되었습니다.";
    showToast("이전 타이머의 종료 시간이 지났습니다.");
    return;
  }

  timerRunning = true;
  timerEndTimestamp = saved.endTimestamp;
  totalDuration = Number(saved.totalDuration) || 0;
  timerRemainingSeconds = Math.ceil(remainingMs / 1000);

  tickTimer();

  if (timerRunning) {
    timerInterval = setInterval(tickTimer, 250);
    updateTimerButtons();
    $("timerStatus").textContent = "이전 타이머를 이어서 진행 중";
  }
}

// ============================================================
// 알림음
// ============================================================
function initAlarmSelect() {
  $("alarmSelect").innerHTML = alarmData.map(a =>
    `<option value="${a.id}">${a.name}</option>`
  ).join("");
}

function loadSavedAlarm() {
  const saved = localStorage.getItem(ALARM_KEY);
  if (saved && alarmData.some(a => a.id === saved)) {
    $("alarmSelect").value = saved;
  }
}

function getSelectedAlarm() {
  return alarmData.find(a => a.id === $("alarmSelect").value) || alarmData[0];
}

let alarmAudio = null;
let alarmAudioFile = null;

function preloadAlarm() {
  const alarm = getSelectedAlarm();

  if (alarmAudio && alarmAudioFile === alarm.file) {
    return;
  }

  if (alarmAudio) {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
  }

  alarmAudio = new Audio(alarm.file);
  alarmAudio.preload = "auto";
  alarmAudioFile = alarm.file;

  // 브라우저가 미리 로딩할 수 있도록 요청
  alarmAudio.load();
}

function previewAlarm() {
  const alarm = getSelectedAlarm();

  if (!alarmAudio || alarmAudioFile !== alarm.file) {
    preloadAlarm();
  }

  if (!alarmAudio) return;

  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(() => {
    showToast("알림음을 재생할 수 없습니다. MP3 파일 경로를 확인해주세요.");
  });
}

function playAlarm() {
  const alarm = getSelectedAlarm();

  if (!alarmAudio || alarmAudioFile !== alarm.file) {
    preloadAlarm();
  }

  if (!alarmAudio) return;

  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(() => {
    showToast(`알림음 "${alarm.name}"을 재생하지 못했습니다.`);
  });
}

// ============================================================
// 테마
// ============================================================
function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY);

  if (saved === "dark") {
    document.body.classList.add("dark");
    $("themeToggle").textContent = "☀️ 라이트 모드";
  } else {
    document.body.classList.remove("dark");
    $("themeToggle").textContent = "🌙 다크 모드";
  }
}

function toggleTheme() {
  const dark = !document.body.classList.contains("dark");

  document.body.classList.toggle("dark", dark);
  localStorage.setItem(THEME_KEY, dark ? "dark" : "light");

  $("themeToggle").textContent = dark
    ? "☀️ 라이트 모드"
    : "🌙 다크 모드";
}

// ============================================================
// 기타
// ============================================================
function formatDuration(seconds) {
  if (!Number.isFinite(seconds)) return "--:--:--";

  seconds = Math.max(0, Math.ceil(seconds));

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function showToast(message) {
  const toast = $("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}
</script>
