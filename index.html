<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>가공 타이머</title>

<style>
    :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #202124;
        --sub-text: #6b7280;
        --border: #e5e7eb;
        --input-bg: #ffffff;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-light: #eef2ff;
    }

    body.dark {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --sub-text: #9ca3af;
        --border: #374151;
        --input-bg: #111827;
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --accent-light: #312e81;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
        transition: background 0.2s, color 0.2s;
    }

    .container {
        width: min(760px, calc(100% - 24px));
        margin: 0 auto;
        padding: 16px 0 24px;
    }

    /* Header */

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
    }

    .theme-button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 12px;
    }

    /* Card */

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 8px;
    }

    .card-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 9px;
    }

    /* Grid */

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .field label {
        display: block;
        color: var(--sub-text);
        font-size: 11px;
        margin-bottom: 4px;
    }

    input,
    select {
        width: 100%;
        height: 36px;
        padding: 0 8px;

        border: 1px solid var(--border);
        border-radius: 7px;

        background: var(--input-bg);
        color: var(--text);

        font-size: 13px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: var(--accent);
    }

    input[readonly] {
        opacity: 0.75;
    }

    /* Calculation result */

    details {
        font-size: 12px;
    }

    summary {
        cursor: pointer;
        font-weight: 700;
        list-style: none;
        user-select: none;
    }

    summary::-webkit-details-marker {
        display: none;
    }

    summary::after {
        content: "＋";
        float: right;
        color: var(--sub-text);
    }

    details[open] summary::after {
        content: "－";
    }

    .result {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);

        color: var(--sub-text);
        line-height: 1.8;
    }

    .result strong {
        color: var(--text);
    }

    .result-note {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.5;
    }

    /* Timer */

    .timer-card {
        text-align: center;
        padding: 14px 12px 15px;
    }

    .timer-label {
        color: var(--sub-text);
        font-size: 11px;
        margin-bottom: 2px;
    }

    .timer {
        font-size: 46px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: 1px;

        font-variant-numeric: tabular-nums;

        margin: 2px 0 11px;
    }

    .timer-buttons {
        display: flex;
        justify-content: center;
        gap: 7px;
    }

    .timer-button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);

        border-radius: 7px;
        padding: 7px 17px;

        font-size: 12px;
        cursor: pointer;
    }

    .timer-button:hover {
        background: var(--bg);
    }

    .timer-button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    .timer-button.primary:hover {
        background: var(--accent-hover);
    }

    .timer-note {
        margin-top: 8px;
        color: var(--sub-text);
        font-size: 10px;
    }

    /* Mobile */

    @media (max-width: 560px) {
        .container {
            width: calc(100% - 16px);
            padding-top: 10px;
        }

        .grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .timer {
            font-size: 40px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">
        <h1 class="title">가공 타이머</h1>

        <button
            class="theme-button"
            id="themeButton"
            onclick="toggleTheme()"
        >
            ☾ 다크 모드
        </button>
    </div>


    <!-- 가공 설정 -->

    <section class="card">

        <div class="card-title">
            가공 설정
        </div>

        <div class="grid">

            <div class="field">
                <label>1회당 가공횟수</label>

                <input
                    id="processCount"
                    type="number"
                    min="1"
                    value="260"
                >
            </div>


            <div class="field">
                <label>1회당 시간 (초)</label>

                <input
                    id="processTime"
                    type="number"
                    min="1"
                    value="60"
                >
            </div>


            <div class="field">
                <label>가공 성공률 (%)</label>

                <input
                    id="successRate"
                    type="number"
                    min="0.01"
                    max="100"
                    step="0.1"
                    value="100"
                >
            </div>

        </div>

    </section>


    <!-- 무게 -->

    <section class="card">

        <div class="card-title">
            무게
        </div>

        <div class="grid">

            <div class="field">
                <label>현재 무게 (LT)</label>

                <input
                    id="currentWeight"
                    type="number"
                    min="0"
                    step="0.1"
                    value="748.4"
                >
            </div>


            <div class="field">
                <label>최대 무게 (LT)</label>

                <input
                    id="maxWeight"
                    type="number"
                    min="0"
                    step="0.1"
                    value="1502"
                >
            </div>


            <div class="field">
                <label>무게 제한</label>

                <select id="weightLimit">

                    <option value="1">100%</option>
                    <option value="1.05">105%</option>
                    <option value="1.10">110%</option>
                    <option value="1.15">115%</option>
                    <option value="1.20">120%</option>
                    <option value="1.25" selected>125%</option>

                </select>
            </div>

        </div>

    </section>


    <!-- 원재료 -->

    <section class="card">

        <div class="card-title">
            원재료
        </div>

        <div class="grid">

            <div class="field">
                <label>원재료</label>

                <select id="material">

                    <option value="iron_ore">
                        철광석
                    </option>

                </select>
            </div>


            <div class="field">
                <label>보유 갯수</label>

                <input
                    id="ownedMaterial"
                    type="number"
                    min="0"
                    value="29636"
                >
            </div>


            <div class="field">
                <label>가공품</label>

                <input
                    id="product"
                    type="text"
                    readonly
                >
            </div>

        </div>

    </section>


    <!-- 계산 결과 -->

    <section class="card">

        <details>

            <summary>
                계산 결과 보기
            </summary>

            <div
                class="result"
                id="result"
            ></div>

        </details>

    </section>


    <!-- Timer -->

    <section class="card timer-card">

        <div class="timer-label">
            예상 가공 시간
        </div>

        <div
            class="timer"
            id="timer"
        >
            00:00
        </div>


        <div class="timer-buttons">

            <button
                class="timer-button primary"
                id="startButton"
            >
                시작
            </button>

            <button
                class="timer-button"
                id="stopButton"
            >
                정지
            </button>

            <button
                class="timer-button"
                id="resetButton"
            >
                초기화
            </button>

        </div>


        <div class="timer-note">
            성공률이 100% 미만이면 평균 예상 시간을 기준으로 합니다.
        </div>

    </section>

</div>


<script>

/* =========================================================
   가공 데이터
   ========================================================= */

const MATERIALS = {

    iron_ore: {

        name: "철광석",

        // 1회 가공 시 1개의 원재료가 몇 개 필요한가
        consumePerProcess: 5,

        // 가공 결과물
        product: "녹아내린 철 조각",

        // 가공품 1개의 무게
        productWeight: 0.3

    }

};


/*
    한 번의 개별 가공 성공 시 평균 생산량

    게임에서 1~4개가 나오는 것으로 확인되었으나
    계산에서는 평균 2개를 사용
*/

const AVERAGE_OUTPUT = 2;


/* =========================================================
   DOM
   ========================================================= */

const processCount =
    document.getElementById("processCount");

const processTime =
    document.getElementById("processTime");

const successRate =
    document.getElementById("successRate");

const currentWeight =
    document.getElementById("currentWeight");

const maxWeight =
    document.getElementById("maxWeight");

const weightLimit =
    document.getElementById("weightLimit");

const material =
    document.getElementById("material");

const ownedMaterial =
    document.getElementById("ownedMaterial");

const product =
    document.getElementById("product");

const result =
    document.getElementById("result");

const timer =
    document.getElementById("timer");


/* =========================================================
   계산
   ========================================================= */

let expectedTimeSeconds = 0;

let remainingTime = 0;

let timerInterval = null;

let timerRunning = false;


/*
    숫자 표시
*/

function formatNumber(value) {

    return Number(value).toLocaleString(
        "ko-KR",
        {
            maximumFractionDigits: 2
        }
    );

}


/*
    시간을

    08:30
    01:08:30

    형태로 표시
*/

function formatTime(seconds) {

    seconds = Math.max(
        0,
        Math.ceil(seconds)
    );

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0")
            + ":"
            + String(minutes).padStart(2, "0")
            + ":"
            + String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0")
        + ":"
        + String(secs).padStart(2, "0")
    );

}


/*
    계산 실행
*/

function calculate() {

    const count =
        Number(processCount.value);

    const cycleTime =
        Number(processTime.value);

    const rate =
        Math.max(
            0.01,
            Math.min(
                100,
                Number(successRate.value)
            )
        ) / 100;


    const current =
        Number(currentWeight.value);

    const max =
        Number(maxWeight.value);

    const limit =
        Number(weightLimit.value);


    const owned =
        Number(ownedMaterial.value);


    const selectedMaterial =
        MATERIALS[material.value];


    if (!selectedMaterial) {

        return;

    }


    /*
        가공품 이름
    */

    product.value =
        selectedMaterial.product;


    /*
        최종 허용 무게

        예:
        1502 × 125%
        = 1877.5 LT
    */

    const finalWeightLimit =
        max * limit;


    /*
        남은 무게
    */

    const remainingWeight =
        Math.max(
            0,
            finalWeightLimit - current
        );


    /*
        성공한 가공 1회에서

        260회 × 평균 2개
        = 520개
    */

    const outputPerSuccess =
        count * AVERAGE_OUTPUT;


    /*
        성공한 가공 1회에서 증가하는 무게
    */

    const weightIncreasePerSuccess =
        outputPerSuccess *
        selectedMaterial.productWeight;


    /*
        성공한 가공 1회에서 소모되는 원재료
    */

    const materialConsumedPerSuccess =
        count *
        selectedMaterial.consumePerProcess;


    /*
        무게 제한까지 필요한 성공 횟수

        중요한 점:

        가공을 먼저 하고
        그 결과 무게를 확인한다.

        따라서 마지막 가공이
        제한을 초과하더라도 실행된다.

        → ceil 사용
    */

    let weightSuccessCycles;

    if (weightIncreasePerSuccess <= 0) {

        weightSuccessCycles = Infinity;

    } else {

        weightSuccessCycles =
            Math.ceil(
                remainingWeight /
                weightIncreasePerSuccess
            );

    }


    /*
        보유 원재료로 가능한 성공 횟수

        한 번의 완전한 가공에 필요한
        원재료가 부족하면 해당 가공은
        수행할 수 없다고 가정한다.

        → floor 사용
    */

    let materialSuccessCycles;

    if (materialConsumedPerSuccess <= 0) {

        materialSuccessCycles = 0;

    } else {

        materialSuccessCycles =
            Math.floor(
                owned /
                materialConsumedPerSuccess
            );

    }


    /*
        실제로 필요한 성공 횟수

        무게와 원재료 중
        먼저 도달하는 쪽
    */

    const requiredSuccessCycles =
        Math.min(
            weightSuccessCycles,
            materialSuccessCycles
        );


    /*
        성공률이 100%라면

        성공 횟수 × 1회 시간

        성공률이 70%라면

        성공 횟수 ÷ 0.7 × 1회 시간

        을 평균 예상 시간으로 사용
    */

    if (
        !Number.isFinite(requiredSuccessCycles) ||
        requiredSuccessCycles <= 0
    ) {

        expectedTimeSeconds = 0;

    } else {

        expectedTimeSeconds =
            (
                requiredSuccessCycles /
                rate
            ) *
            cycleTime;

    }


    /*
        타이머 갱신
    */

    remainingTime =
        expectedTimeSeconds;

    timer.textContent =
        formatTime(remainingTime);


    /*
        종료 원인
    */

    let reason;

    if (
        weightSuccessCycles <=
        materialSuccessCycles
    ) {

        reason = "무게 제한";

    } else {

        reason = "원재료 소진";

    }


    /*
        예상 최종 무게

        성공 횟수만큼 실제 가공이
        성공한다고 가정한 평균값
    */

    const expectedFinalWeight =
        current +
        (
            requiredSuccessCycles *
            weightIncreasePerSuccess
        );


    /*
        예상 생산량
    */

    const expectedOutput =
        requiredSuccessCycles *
        outputPerSuccess;


    /*
        계산 결과
    */

    result.innerHTML = `

        최종 무게 제한:
        <strong>
            ${formatNumber(finalWeightLimit)} LT
        </strong>
        <br>

        1회 성공 시 생산량:
        <strong>
            ${formatNumber(outputPerSuccess)}개
        </strong>
        <br>

        1회 성공 시 무게 증가:
        <strong>
            ${formatNumber(weightIncreasePerSuccess)} LT
        </strong>
        <br>

        1회 성공 시 원재료 소모:
        <strong>
            ${formatNumber(materialConsumedPerSuccess)}개
        </strong>
        <br>

        필요한 성공 횟수:
        <strong>
            ${formatNumber(requiredSuccessCycles)}회
        </strong>
        <br>

        예상 생산량:
        <strong>
            ${formatNumber(expectedOutput)}개
        </strong>
        <br>

        예상 최종 무게:
        <strong>
            ${formatNumber(expectedFinalWeight)} LT
        </strong>
        <br>

        평균 예상 시간:
        <strong>
            ${formatTime(expectedTimeSeconds)}
        </strong>
        <br>

        종료 원인:
        <strong>
            ${reason}
        </strong>

        <div class="result-note">

            ※ 실패한 가공은 시간만 소모하며
            원재료와 가공품에는 영향을 주지 않습니다.
            <br>

            ※ 무게는 가공품이 생성된 이후 확인합니다.

        </div>

    `;

}


/* =========================================================
   타이머
   ========================================================= */


/*
    시작
*/

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startTimer
    );


function startTimer() {

    if (timerRunning) {

        return;

    }


    if (remainingTime <= 0) {

        remainingTime =
            expectedTimeSeconds;

    }


    if (remainingTime <= 0) {

        return;

    }


    timerRunning = true;


    const startTime =
        performance.now();

    const initialTime =
        remainingTime;


    timerInterval =
        setInterval(
            () => {

                const elapsed =
                    (
                        performance.now() -
                        startTime
                    ) / 1000;


                remainingTime =
                    Math.max(
                        0,
                        initialTime - elapsed
                    );


                timer.textContent =
                    formatTime(remainingTime);


                /*
                    종료
                */

                if (remainingTime <= 0) {

                    stopTimer(false);

                    playAlarm();

                }

            },
            100
        );

}


/*
    정지
*/

document
    .getElementById("stopButton")
    .addEventListener(
        "click",
        () => {

            stopTimer(false);

        }
    );


function stopTimer(reset) {

    if (timerInterval !== null) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }


    timerRunning = false;


    if (reset) {

        remainingTime =
            expectedTimeSeconds;

        timer.textContent =
            formatTime(
                remainingTime
            );

    }

}


/*
    초기화
*/

document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        () => {

            stopTimer(true);

        }
    );


/* =========================================================
   알림음
   ========================================================= */

function playAlarm() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const context =
            new AudioContext();


        /*
            3번 울리는 간단한 알림음
        */

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const oscillator =
                context.createOscillator();

            const gain =
                context.createGain();


            oscillator.type =
                "sine";

            oscillator.frequency.value =
                880;


            gain.gain.value =
                0.08;


            oscillator.connect(
                gain
            );

            gain.connect(
                context.destination
            );


            const start =
                context.currentTime +
                i * 0.55;


            oscillator.start(start);

            oscillator.stop(
                start + 0.3
            );

        }

    } catch (error) {

        console.log(
            "알림음을 재생할 수 없습니다.",
            error
        );

    }

}


/* =========================================================
   다크 모드
   ========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    const button =
        document.getElementById(
            "themeButton"
        );


    if (dark) {

        button.textContent =
            "☀ 라이트 모드";

        localStorage.setItem(
            "darkMode",
            "true"
        );

    } else {

        button.textContent =
            "☾ 다크 모드";

        localStorage.setItem(
            "darkMode",
            "false"
        );

    }

}


/*
    저장된 다크 모드 적용
*/

if (
    localStorage.getItem(
        "darkMode"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

    document.getElementById(
        "themeButton"
    ).textContent =
        "☀ 라이트 모드";

}


/* =========================================================
   입력값 변경 감지
   ========================================================= */

const inputs = document.querySelectorAll(
    "input, select"
);


inputs.forEach(
    element => {

        element.addEventListener(
            "input",
            calculate
        );

        element.addEventListener(
            "change",
            calculate
        );

    }
);


/* =========================================================
   최초 계산
   ========================================================= */

calculate();

</script>

</body>
</html>
