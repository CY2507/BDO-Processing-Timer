<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가공 타이머</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #20242a;
    --muted: #6f7782;
    --line: #e1e4e8;
    --accent: #3b6ff5;
    --accent-soft: #eef3ff;
    --danger: #d94b4b;
    --success: #2f8f5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                 "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container {
    width: min(920px, calc(100% - 32px));
    margin: 0 auto;
    padding: 40px 0 60px;
  }
  h1 { margin: 0 0 8px; font-size: 30px; }
  .subtitle { color: var(--muted); margin: 0 0 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 2px 8px rgba(20, 30, 50, .04);
  }
  .full { grid-column: 1 / -1; }
  h2 {
    margin: 0 0 18px;
    font-size: 18px;
  }
  .field { margin-bottom: 15px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 650;
  }
  input, select {
    width: 100%;
    height: 44px;
    border: 1px solid #ccd1d8;
    border-radius: 9px;
    padding: 0 12px;
    font-size: 15px;
    background: white;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: 2px solid rgba(59,111,245,.18);
    border-color: var(--accent);
  }
  .unit {
    position: relative;
  }
  .unit input { padding-right: 52px; }
  .unit span {
    position: absolute;
    right: 12px;
    top: 10px;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }
  .readonly {
    background: #f1f3f5;
    color: #525a65;
  }
  .material-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
  }
  .info-box {
    border: 1px solid var(--line);
    background: #fafbfc;
    border-radius: 9px;
    padding: 12px;
  }
  .info-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .info-value { font-size: 14px; font-weight: 650; }
  .result {
    border: 1px solid #d9e2ff;
    background: var(--accent-soft);
  }
  .main-result {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .hero {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .value { font-size: 29px; font-weight: 750; margin-top: 3px; }
  .reason {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 9px;
    border-radius: 999px;
    background: #f0f2f5;
    font-size: 12px;
    font-weight: 650;
  }
  .reason.weight { color: var(--danger); }
  .reason.material { color: var(--success); }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .stat {
    background: white;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px;
  }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { margin-top: 3px; font-weight: 700; }
  .note {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  .error {
    color: var(--danger);
    background: #fff2f2;
    border: 1px solid #f0caca;
    padding: 12px;
    border-radius: 9px;
    font-size: 14px;
  }
  .footer {
    margin-top: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 680px) {
    .container { width: min(100% - 20px, 920px); padding-top: 24px; }
    .grid { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
    .material-info, .main-result, .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>가공 타이머</h1>
  <p class="subtitle">가공품 무게 제한 또는 원재료 고갈까지의 예상 시간을 계산합니다.</p>

  <div class="grid">
    <section class="card">
      <h2>가공 설정</h2>

      <div class="field">
        <label for="processCount">1회당 가공 횟수</label>
        <div class="unit">
          <input id="processCount" type="number" min="1" step="1" value="260">
          <span>회</span>
        </div>
      </div>

      <div class="field">
        <label for="processTime">1회당 시간</label>
        <div class="unit">
          <input id="processTime" type="number" min="0.01" step="0.01" value="60">
          <span>초</span>
        </div>
      </div>

      <div class="field">
        <label for="successRate">가공 성공률</label>
        <div class="unit">
          <input id="successRate" type="number" min="0.01" max="100" step="0.1" value="100">
          <span>%</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>무게</h2>

      <div class="field">
        <label for="currentWeight">현재 무게</label>
        <div class="unit">
          <input id="currentWeight" type="number" min="0" step="0.1" value="748.4">
          <span>LT</span>
        </div>
      </div>

      <div class="field">
        <label for="maxWeight">최대 무게</label>
        <div class="unit">
          <input id="maxWeight" type="number" min="0" step="0.1" value="1502">
          <span>LT</span>
        </div>
      </div>

      <div class="field">
        <label for="weightLimit">무게 제한</label>
        <select id="weightLimit">
          <option value="1">100%</option>
          <option value="1.05">105%</option>
          <option value="1.10">110%</option>
          <option value="1.15">115%</option>
          <option value="1.20">120%</option>
          <option value="1.25" selected>125%</option>
        </select>
      </div>
    </section>

    <section class="card full">
      <h2>원재료</h2>

      <div class="field">
        <label for="material">원재료</label>
        <select id="material"></select>
      </div>

      <div class="field">
        <label for="owned">보유 개수</label>
        <div class="unit">
          <input id="owned" type="number" min="0" step="1" value="29636">
          <span>개</span>
        </div>
      </div>

      <div class="material-info">
        <div class="info-box">
          <div class="info-label">1회 가공 시 소모 수</div>
          <div class="info-value" id="consumeInfo">5개</div>
        </div>
        <div class="info-box">
          <div class="info-label">가공품</div>
          <div class="info-value" id="productInfo">녹아내린 철 조각</div>
        </div>
        <div class="info-box">
          <div class="info-label">가공품 1개당 무게</div>
          <div class="info-value" id="productWeightInfo">0.3 LT</div>
        </div>
      </div>
    </section>

    <section class="card full result" id="resultCard">
      <h2>계산 결과</h2>
      <div id="resultContent"></div>
    </section>
  </div>

  <div class="footer">
    생산량은 성공한 가공 1회당 평균 2개로 계산합니다.
  </div>
</div>

<script>
const MATERIALS = {
  iron_ore: {
    name: "철광석",
    consume: 5,
    product: "녹아내린 철 조각",
    productWeight: 0.3
  }
  // 새로운 원재료는 이곳에 추가하면 됩니다.
};

const $ = id => document.getElementById(id);

function fmt(value, digits = 2) {
  if (!Number.isFinite(value)) return "-";
  return value.toLocaleString("ko-KR", {
    maximumFractionDigits: digits
  });
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "-";
  const rounded = Math.max(0, Math.round(seconds));
  const h = Math.floor(rounded / 3600);
  const m = Math.floor((rounded % 3600) / 60);
  const s = rounded % 60;

  if (h > 0) return `${h}시간 ${m}분 ${s}초`;
  if (m > 0) return `${m}분 ${s}초`;
  return `${s}초`;
}

function populateMaterials() {
  const select = $("material");
  select.innerHTML = "";

  for (const [id, data] of Object.entries(MATERIALS)) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = data.name;
    select.appendChild(option);
  }
}

function updateMaterialInfo() {
  const data = MATERIALS[$("material").value];
  if (!data) return;

  $("consumeInfo").textContent = `${fmt(data.consume, 0)}개`;
  $("productInfo").textContent = data.product;
  $("productWeightInfo").textContent = `${fmt(data.productWeight, 4)} LT`;
}

function calculate() {
  const processCount = Number($("processCount").value);
  const processTime = Number($("processTime").value);
  const successRatePercent = Number($("successRate").value);
  const currentWeight = Number($("currentWeight").value);
  const maxWeight = Number($("maxWeight").value);
  const weightLimitMultiplier = Number($("weightLimit").value);
  const owned = Number($("owned").value);

  const material = MATERIALS[$("material").value];

  if (
    !material ||
    processCount <= 0 ||
    processTime <= 0 ||
    successRatePercent <= 0 ||
    successRatePercent > 100 ||
    currentWeight < 0 ||
    maxWeight <= 0 ||
    owned < 0
  ) {
    $("resultContent").innerHTML =
      `<div class="error">입력값을 확인해주세요. 성공률은 0보다 크고 100 이하로 입력해야 합니다.</div>`;
    return;
  }

  const successRate = successRatePercent / 100;
  const finalWeightLimit = maxWeight * weightLimitMultiplier;
  const remainingWeight = finalWeightLimit - currentWeight;

  // 성공한 1사이클의 결과
  const averageOutputPerProcess = 2;
  const outputPerSuccess = processCount * averageOutputPerProcess;
  const weightIncreasePerSuccess =
    outputPerSuccess * material.productWeight;
  const materialConsumedPerSuccess =
    processCount * material.consume;

  // 종료 조건별 '필요한 성공 사이클 수'
  // 가공 후 무게를 검사하므로 무게 조건은 올림한다.
  let successCyclesForWeight = Infinity;
  if (remainingWeight <= 0) {
    successCyclesForWeight = 0;
  } else {
    successCyclesForWeight =
      Math.ceil(remainingWeight / weightIncreasePerSuccess);
  }

  // 원재료는 성공 시에만 소비된다.
  // 마지막 성공 사이클의 소모량까지 필요하므로 올림한다.
  let successCyclesForMaterial = Infinity;
  if (owned <= 0) {
    successCyclesForMaterial = 0;
  } else {
    successCyclesForMaterial =
      Math.ceil(owned / materialConsumedPerSuccess);
  }

  let limitingReason;
  let requiredSuccessCycles;

  if (successCyclesForWeight === 0) {
    limitingReason = "weight";
    requiredSuccessCycles = 0;
  } else if (successCyclesForMaterial === 0) {
    limitingReason = "material";
    requiredSuccessCycles = 0;
  } else if (successCyclesForWeight <= successCyclesForMaterial) {
    limitingReason = "weight";
    requiredSuccessCycles = successCyclesForWeight;
  } else {
    limitingReason = "material";
    requiredSuccessCycles = successCyclesForMaterial;
  }

  // 성공률이 100%가 아니면 실제 성공 횟수는 확률적으로 달라진다.
  // 여기서는 기대값을 사용한다.
  const expectedAttempts =
    requiredSuccessCycles / successRate;
  const expectedTime =
    expectedAttempts * processTime;

  // 예상 종료 상태
  const expectedSuccesses = requiredSuccessCycles;
  const expectedOutput = expectedSuccesses * outputPerSuccess;
  const expectedMaterialUsed =
    expectedSuccesses * materialConsumedPerSuccess;

  // 실제 종료는 마지막 '성공' 사이클 이후 발생한다.
  // 기대값 기준의 예상 무게.
  const expectedFinalWeight =
    currentWeight + expectedOutput * material.productWeight;

  const badgeClass =
    limitingReason === "weight" ? "weight" : "material";
  const reasonText =
    limitingReason === "weight"
      ? "무게 제한 도달"
      : "원재료 고갈";

  const rateNote =
    successRatePercent === 100
      ? "성공률이 100%이므로 계산된 시간은 확정 시간입니다."
      : "성공/실패는 사이클 단위로 판정되므로, 시간은 성공률을 이용한 평균 예상값입니다.";

  $("resultContent").innerHTML = `
    <div class="main-result">
      <div class="hero">
        <div class="label">예상 가공 시간</div>
        <div class="value">${formatTime(expectedTime)}</div>
        <span class="reason ${badgeClass}">${reasonText}</span>
      </div>
      <div class="hero">
        <div class="label">최종 무게</div>
        <div class="value">${fmt(expectedFinalWeight, 2)} LT</div>
        <div class="label">제한 ${fmt(finalWeightLimit, 2)} LT</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">필요 성공 횟수</div>
        <div class="value">${fmt(requiredSuccessCycles, 0)}회</div>
      </div>
      <div class="stat">
        <div class="label">평균 예상 시도 횟수</div>
        <div class="value">${fmt(expectedAttempts, 2)}회</div>
      </div>
      <div class="stat">
        <div class="label">예상 생산량</div>
        <div class="value">${fmt(expectedOutput, 0)}개</div>
      </div>
      <div class="stat">
        <div class="label">예상 원재료 소모</div>
        <div class="value">${fmt(expectedMaterialUsed, 0)}개</div>
      </div>
      <div class="stat">
        <div class="label">1회 성공 시 생산량</div>
        <div class="value">${fmt(outputPerSuccess, 0)}개</div>
      </div>
      <div class="stat">
        <div class="label">1회 성공 시 무게 증가</div>
        <div class="value">${fmt(weightIncreasePerSuccess, 4)} LT</div>
      </div>
    </div>

    <p class="note">${rateNote}</p>
    <p class="note">
      계산 규칙: 가공 성공 시 원재료를 소모하고 평균 2개의 가공품을 생산합니다.
      실패 시 원재료와 가공품에는 변화가 없고 시간만 소비합니다.
      가공품을 생성한 뒤 무게 제한을 확인하며, 제한을 넘으면 해당 가공을 완료한 후 중단합니다.
    </p>
  `;
}

for (const id of [
  "processCount", "processTime", "successRate",
  "currentWeight", "maxWeight", "weightLimit", "owned"
]) {
  $(id).addEventListener("input", calculate);
  $(id).addEventListener("change", calculate);
}

$("material").addEventListener("change", () => {
  updateMaterialInfo();
  calculate();
});

populateMaterials();
$("material").value = "iron_ore";
updateMaterialInfo();
calculate();
</script>
</body>
</html>
