<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가공 타이머</title>
<link rel="icon" href="icon.ico">
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#202124;--muted:#6b7280;--border:#d9dde3;--input:#fff;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--input:#111827;--accent:#60a5fa}
.container{width:min(760px,calc(100% - 20px));margin:12px auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
h1{font-size:19px;margin:0}.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px}
.card-title{font-weight:700;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
input,select,button{width:100%;height:33px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);padding:0 8px;font:inherit}
input:read-only{opacity:.7}button{cursor:pointer;font-weight:600}.primary{background:var(--accent);color:white;border-color:var(--accent)}
.top{width:auto;padding:0 9px}
.alarm-grid{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:7px;align-items:end}
.alarm-preview{width:100%}
@media(max-width:520px){.alarm-grid{grid-template-columns:1fr}}
.timer{text-align:center}.timer-display{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 7px}
.timer-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:auto}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px}.row span{color:var(--muted)}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin-top:7px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px;border-bottom:1px solid var(--border);text-align:left}th{color:var(--muted)}

.search-select{position:relative}
.search-select-button{display:flex;align-items:center;justify-content:space-between;text-align:left}
.search-arrow{font-size:10px;color:var(--muted);margin-left:8px}
.search-select-menu{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:6px}
.material-search-input{width:100%;margin-bottom:5px}
.material-options{max-height:220px;overflow-y:auto}
.material-option{display:block;width:100%;height:32px;border:0;border-radius:5px;background:transparent;color:var(--text);text-align:left;padding:0 8px;cursor:pointer;font:inherit}
.material-option:hover,.material-option.selected{background:var(--bg)}
.material-no-result{padding:8px;color:var(--muted);font-size:12px}
@media(max-width:520px){.grid,.result{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header><h1>가공 타이머</h1><button id="dark" class="top">다크 모드</button></header>

<section class="card">
<div class="card-title">스탯</div>
<div class="grid">
<div><label>1회당 가공횟수</label><input id="count" type="number" min="1" value="260"></div>
<div><label>가공 성공률 (%)</label><input id="rate" type="number" min="0" max="100" value="100"></div>
<div></div>
</div>
</section>

<section class="card">
<div class="card-title">무게</div>
<div class="grid">
<div><label>현재 무게 (LT)</label><input id="cur" type="number" min="0" step=".1" value="748.4"></div>
<div><label>최대 무게 (LT)</label><input id="max" type="number" min="0" step=".1" value="1502"></div>
<div><label>무게 제한</label><select id="limit"><option value="1">100%</option><option value="1.05">105%</option><option value="1.1" selected>110%</option><option value="1.15">115%</option><option value="1.2">120%</option><option value="1.25">125%</option></select></div>
</div>
</section>

<section class="card">
<div class="card-title">가공 시작</div>
<div class="grid">
<div class="material-search-field">
<label>원재료</label>
<div class="search-select" id="materialSelect">
<button type="button" class="search-select-button" id="materialButton" aria-expanded="false">
<span id="materialSelected">원재료 선택</span><span class="search-arrow">▼</span>
</button>
<div class="search-select-menu" id="materialMenu" hidden>
<input id="materialSearch" class="material-search-input" type="search" placeholder="원재료 검색..." autocomplete="off">
<div id="materialOptions" class="material-options"></div>
</div>
</div>
</div>
<div><label>가공품</label><input id="product" readonly></div>
<div><label>보유 갯수</label><input id="owned" type="number" min="0" value="29636"></div>
</div>
</section>


<section class="card">
<div class="card-title">알림</div>
<div class="alarm-grid">
<div>
<label for="alarmSelect">알림음</label>
<select id="alarmSelect"></select>
</div>
<div>
<label>&nbsp;</label>
<button id="alarmPreview" class="alarm-preview" type="button">▶ 미리듣기</button>
</div>
</div>
<div id="alarmNote" class="note"></div>
</section>

<section class="card"><details><summary>계산 결과</summary><div id="result" class="result"></div><div id="note" class="note"></div></details></section>

<section class="card"><details><summary>데이터 테이블</summary><div style="overflow:auto;margin-top:7px"><table><thead><tr><th>원재료</th><th>가공품</th><th>가공품 무게</th><th>1회 가공 소모</th><th>1회당 시간</th></tr></thead><tbody id="tbody"></tbody></table></div></details></section>

<section class="card timer"><div class="card-title">타이머</div><div id="timer" class="timer-display">00:00</div><div class="timer-buttons"><button id="start" class="primary">시작</button><button id="stop">정지</button><button id="reset">초기화</button></div></section>
</div>

<script>
/*
알림음 파일은 다음 경로에 넣습니다.
  sounds/alarm1.mp4
  sounds/alarm2.mp4
  sounds/alarm3.mp4

새 알림음을 추가하려면 alarmData에 항목을 추가하면 됩니다.
예:
 {id:"alarm4",name:"알림음 4",file:"sounds/alarm4.mp4"}
*/
/* HTML 내부 게임 데이터: 원재료, 가공품, 가공품 무게, 1회 가공 소모, 1회당 시간 */
const materialData=[
 {raw:"철광석",product:"녹아내린 철 조각",weight:.3,consume:5,time:60},
 {raw:"구리 광석",product:"녹아내린 구리 조각",weight:.25,consume:5,time:60},
 {raw:"주석 광석",product:"녹아내린 주석 조각",weight:.2,consume:5,time:60}
];
const AVG=2,$=id=>document.getElementById(id);
let selected=materialData[0],expected=0,remain=0,running=false,last=0,raf=null;

function fmt(s){s=Math.max(0,Math.ceil(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`}
function num(x){return Number(x.toFixed(3)).toString()}
function renderTimer(){$("timer").textContent=fmt(remain);document.title=running?fmt(remain):"가공 타이머"}
function calculate(){
 let n=Math.max(0,+$("count").value||0),r=Math.min(100,Math.max(0,+$("rate").value||0))/100;
 let cur=Math.max(0,+$("cur").value||0),max=Math.max(0,+$("max").value||0),lim=+( $("limit").value)||1,owned=Math.max(0,+$("owned").value||0);
 let final=max*lim,need=Math.max(0,final-cur),out=n*AVG,inc=out*selected.weight,consume=n*selected.consume;
 let wc=inc>0?Math.ceil(need/inc):Infinity;if(need<=0)wc=0;
 let mc=consume>0?Math.floor(owned/consume):Infinity;
 let success=Math.min(wc,mc),attempt=success===Infinity?0:(r?success/r:Infinity);
 expected=attempt*selected.time;
 if(!running){remain=Number.isFinite(expected)?Math.max(0,expected):0;renderTimer()}
 let reason=wc<=mc?"무게 제한":"원재료 소진",finalW=cur+success*inc;
 const rows=[["무게 제한",num(final)+" LT"],["가공품",selected.product],["1회 성공 시 생산량",num(out)+"개"],["1회 성공 시 무게 증가",num(inc)+" LT"],["1회 성공 시 재료 소모",num(consume)+"개"],["무게 기준 성공 횟수",wc===Infinity?"제한 없음":Math.floor(wc)+"회"],["재료 기준 성공 횟수",mc===Infinity?"제한 없음":mc+"회"],["종료 원인",reason],["필요 성공 횟수",Math.floor(success)+"회"],["예상 시도 횟수",Number.isFinite(attempt)?num(attempt)+"회":"계산 불가"],["예상 생산량",num(success*out)+"개"],["예상 종료 무게",num(finalW)+" LT"],["예상 시간",Number.isFinite(expected)?fmt(expected):"계산 불가"]];
 $("result").innerHTML=rows.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
 $("note").textContent=r<1?"성공률이 100% 미만이므로 표시 시간은 평균 예상 시간입니다. 실패 회차도 시간은 소모되지만 재료와 생산물은 변하지 않습니다.":"가공품 생성 후 무게를 확인하므로 마지막 가공은 제한을 초과할 수 있습니다.";
}
function apply(){selected=materialData[materialIndex]||materialData[0];$("product").value=selected.product;calculate()}
const alarmData=[
 {id:"alarm1",name:"알림음 1",file:"sounds/alarm1.mp4"},
 {id:"alarm2",name:"알림음 2",file:"sounds/alarm2.mp4"},
 {id:"alarm3",name:"알림음 3",file:"sounds/alarm3.mp4"}
];
let alarmAudio=null;

function getSelectedAlarm(){
 const id=localStorage.getItem("processingTimerAlarm")||alarmData[0].id;
 return alarmData.find(x=>x.id===id)||alarmData[0];
}
function setAlarmAudio(){
 const alarm=getSelectedAlarm();
 if(alarmAudio) alarmAudio.pause();
 alarmAudio=new Audio(alarm.file);
 alarmAudio.preload="auto";
}
function playAlarm(){
 try{
  if(!alarmAudio)setAlarmAudio();
  alarmAudio.currentTime=0;
  const p=alarmAudio.play();
  if(p&&p.catch)p.catch(()=>{});
 }catch(e){
  console.warn("알림음 재생 오류",e);
 }
}
function alarm(){playAlarm()}
function tick(now){if(!running)return;remain=Math.max(0,remain-(now-last)/1000);last=now;renderTimer();if(remain<=0){running=false;cancelAnimationFrame(raf);raf=null;renderTimer();alarm();return}raf=requestAnimationFrame(tick)}
$("start").onclick=()=>{if(running||remain<=0)return;running=true;last=performance.now();renderTimer();raf=requestAnimationFrame(tick)}
$("stop").onclick=()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=null;renderTimer()}
$("reset").onclick=()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=null;calculate()}
$("dark").onclick=()=>{document.body.classList.toggle("dark");$("dark").textContent=document.body.classList.contains("dark")?"라이트 모드":"다크 모드"}

const materialButton=$("materialButton");
const materialMenu=$("materialMenu");
const materialSearch=$("materialSearch");
const materialOptions=$("materialOptions");
const materialSelected=$("materialSelected");
let materialIndex=0;

function renderMaterialOptions(keyword=""){
 const q=keyword.trim().toLowerCase();
 const matches=materialData.map((d,i)=>({d,i})).filter(x=>!q||x.d.raw.toLowerCase().includes(q)||x.d.product.toLowerCase().includes(q));
 if(!matches.length){materialOptions.innerHTML='<div class="material-no-result">검색 결과가 없습니다.</div>';return;}
 materialOptions.innerHTML=matches.map(x=>`<button type="button" class="material-option ${x.i===materialIndex?"selected":""}" data-index="${x.i}">${x.d.raw}</button>`).join("");
 materialOptions.querySelectorAll(".material-option").forEach(b=>b.addEventListener("click",()=>{
  materialIndex=Number(b.dataset.index);
  materialSelected.textContent=materialData[materialIndex].raw;
  closeMaterialMenu();
  apply();
 }));
}
function openMaterialMenu(){
 materialMenu.hidden=false;
 materialButton.setAttribute("aria-expanded","true");
 materialSearch.value="";
 renderMaterialOptions();
 requestAnimationFrame(()=>materialSearch.focus());
}
function closeMaterialMenu(){
 materialMenu.hidden=true;
 materialButton.setAttribute("aria-expanded","false");
}
materialButton.addEventListener("click",()=>materialMenu.hidden?openMaterialMenu():closeMaterialMenu());
materialSearch.addEventListener("input",()=>renderMaterialOptions(materialSearch.value));
document.addEventListener("click",e=>{if(!$("materialSelect").contains(e.target))closeMaterialMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMaterialMenu()});

materialSelected.textContent=materialData[0].raw;
renderMaterialOptions();

const alarmSelect=$("alarmSelect");
const alarmPreview=$("alarmPreview");
const alarmNote=$("alarmNote");

alarmSelect.innerHTML=alarmData.map(a=>`<option value="${a.id}">${a.name}</option>`).join("");
alarmSelect.value=getSelectedAlarm().id;
setAlarmAudio();

alarmSelect.addEventListener("change",()=>{
 localStorage.setItem("processingTimerAlarm",alarmSelect.value);
 setAlarmAudio();
 alarmNote.textContent="선택한 알림음이 저장되었습니다.";
});

alarmPreview.addEventListener("click",()=>{
 setAlarmAudio();
 playAlarm();
});

[$("count"),$("rate"),$("cur"),$("max"),$("limit"),$("owned")].forEach(e=>{e.oninput=calculate;e.onchange=calculate});
$("tbody").innerHTML=materialData.map(d=>`<tr><td>${d.raw}</td><td>${d.product}</td><td>${d.weight}</td><td>${d.consume}</td><td>${d.time}초</td></tr>`).join("");
apply();
</script>
</body>
</html>
